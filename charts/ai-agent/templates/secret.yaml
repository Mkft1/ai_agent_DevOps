{{- if not .Values.secrets.existingSecret }}
# API-ключи и webhook'и. В production предпочтите external-secrets/Vault:
# задайте secrets.existingSecret — и чарт не будет создавать Secret сам.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ai-agent.secretName" . }}
  labels:
    {{- include "ai-agent.labels" . | nindent 4 }}
type: Opaque
data:
  QWEN_API_KEY: {{ .Values.secrets.llmApiKey | b64enc | quote }}
  OPENAI_API_KEY: {{ .Values.secrets.openaiApiKey | b64enc | quote }}
  SLACK_WEBHOOK_URL: {{ .Values.secrets.slackWebhookUrl | b64enc | quote }}
{{- end }}
