  - llm
  - sre
  - kubernetes
  - incident-response
  - rag
  - observability
home: https://github.com/Mkft1/ai_agent_DevOps
sources:
  - https://github.com/Mkft1/ai_agent_DevOps
maintainers:
  - name: Mkft1
annotations:
  # Типы workload'ов, для которых предназначен чарт: stateless API-сервис
  category: "application"
  licenses: "MIT"
