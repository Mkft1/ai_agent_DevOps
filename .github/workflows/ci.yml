name: CI

# Пропуск прогона: добавьте [skip ci] или [ci skip] в заголовок коммита
# (нативная поддержка GitHub Actions) — полезно для docs-only правок.
#
# Топология пайплайна (цель 5-6 минут):
#   PR:  lint ─┐
#        helm ─┼─> test (pytest-xdist)                     -> финиш
#   main: lint ─┤
#         helm ─┴─> test ──> build (Docker, gha-кэш max)  -> финиш
#                         └─> integration-test (kind e2e, только main/dispatch)
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Run ruff check
        run: ruff check src tests scripts eval ui

  helm:
    name: Helm lint & template
    runs-on: ubuntu-latest
    # Параллельно с lint (без needs): быстрый независимый гейт чарта.
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install Helm
        run: curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
      - name: helm lint
        run: helm lint charts/ai-agent
      - name: helm template (render + YAML validation)
        run: |
          helm template ai-agent charts/ai-agent --set secrets.llmApiKey=ci-placeholder \
            | python3 -c 'import sys, yaml; docs=[d for d in yaml.safe_load_all(sys.stdin) if d]; kinds=sorted({d["kind"] for d in docs}); print(kinds); assert "Deployment" in kinds and "Secret" in kinds'

  test:
    name: Tests (pytest + coverage, xdist)
    runs-on: ubuntu-latest
    # Зависит только от lint (fast-gate: не греем раннер тестами при битом линтере).
    needs: lint
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Run pytest with coverage (parallel, xdist)
        # -n auto: тесты раскладываются по всем ядрам раннера (ускорение 2-4x);
        # pytest-cov корректно суммирует покрытиеAcross workers в coverage.xml.
        run: pytest -n auto --cov=src --cov-report=xml --cov-fail-under=85 tests/
      - name: Docs metrics drift guard (README vs pytest)
        run: python scripts/check_docs_metrics.py
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          retention-days: 7

  build:
    name: Build Docker image (no push)
    runs-on: ubuntu-latest
    needs: [test, helm]
    # На PR образ не собираем (lint+test+helm дают быстрый фидбек); полная
    # сборка со smoke-тестом — на push в main и workflow_dispatch.
    if: github.event_name != 'pull_request'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build image (validation only, no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: k8s-incident-agent:ci-${{ github.sha }}
          cache-from: type=gha
          # mode=max экспортирует ВСЕ слои builder-стадии, включая cache-mounts
          # pip из Dockerfile (--mount=type=cache,target=/root/.cache/pip):
          # при изменении requirements.txt wheels не скачиваются заново, а
          # берутся из кэша — это и даёт целевые 5-6 минут на тёплом раннере.
          cache-to: type=gha,mode=max
      - name: Smoke test container
        run: |
          docker run --rm -d --name agent-smoke \
            -e LOG_LEVEL=INFO \
            -p 8000:8000 \
            k8s-incident-agent:ci-${{ github.sha }}
          for i in $(seq 1 15); do
            if curl -sf http://localhost:8000/health; then
              echo "Health check OK"
              break
            fi
            sleep 2
            if [ "$i" = "15" ]; then
              echo "Health check FAILED"
              docker logs agent-smoke
              exit 1
            fi
          done
          docker stop agent-smoke

  integration-test:
    name: E2E (kind cluster, ImagePullBackOff)
    runs-on: ubuntu-latest
    # e2e валидирует ИСХОДНИКИ агента (uvicorn из репозитория), а не образ —
    # поэтому ждём только test и идём ПАРАЛЛЕЛЬНО с build (экономия ~3 минуты).
    needs: [test]
    # Тяжёлый e2e-сценарий: только push в main и ручные запуски, PR не замедляет.
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    env:
      QWEN_API_KEY: ${{ secrets.QWEN_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        if: ${{ env.QWEN_API_KEY != '' || env.OPENAI_API_KEY != '' }}
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Install kind and kubectl (pinned versions)
        if: ${{ env.QWEN_API_KEY != '' || env.OPENAI_API_KEY != '' }}
        run: |
          # /usr/local/bin на новых раннерах может быть недоступен для chmod —
          # ставим в $HOME/.local/bin и добавляем в PATH следующего шага.
          mkdir -p "$HOME/.local/bin"
          curl -fsSL -o "$HOME/.local/bin/kind" https://kind.sigs.k8s.io/dl/v0.24.0/kind-linux-amd64
          curl -fsSL -o "$HOME/.local/bin/kubectl" "https://dl.k8s.io/release/v1.31.1/bin/linux/amd64/kubectl"
          chmod +x "$HOME/.local/bin/kind" "$HOME/.local/bin/kubectl"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/kind" version && "$HOME/.local/bin/kubectl" version --client
      - name: Run kind e2e test (real cluster + real /diagnose)
        if: ${{ env.QWEN_API_KEY != '' || env.OPENAI_API_KEY != '' }}
        run: bash scripts/run_integration_test.sh
      - name: E2E skipped (no LLM secret configured)
        if: ${{ !(env.QWEN_API_KEY != '' || env.OPENAI_API_KEY != '') }}
        run: |
          echo "No QWEN_API_KEY/OPENAI_API_KEY repository secret configured - e2e skipped."
          echo "Add secret QWEN_API_KEY (Settings -> Secrets and variables -> Actions) to enable the real end-to-end diagnosis check."
