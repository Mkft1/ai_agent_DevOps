name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Run ruff check
        run: ruff check src tests scripts

  test:
    name: Tests (pytest + coverage)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Run pytest with coverage
        run: pytest --cov=src --cov-report=xml --cov-fail-under=85 tests/
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          retention-days: 7

  build:
    name: Build Docker image (no push)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build image (validation only, no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: k8s-incident-agent:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test container
        run: |
          docker run --rm -d --name agent-smoke \
            -e LOG_LEVEL=INFO \
            -p 8000:8000 \
            k8s-incident-agent:ci-${{ github.sha }}
          for i in $(seq 1 15); do
            if curl -sf http://localhost:8000/health; then
              echo "Health check OK"
              break
            fi
            sleep 2
            if [ "$i" = "15" ]; then
              echo "Health check FAILED"
              docker logs agent-smoke
              exit 1
            fi
          done
          docker stop agent-smoke

  integration-test:
    name: E2E (kind cluster, ImagePullBackOff)
    runs-on: ubuntu-latest
    needs: build
    # Тяжёлый e2e-сценарий: только push в main и ручные запуски, PR не замедляет.
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    env:
      QWEN_API_KEY: ${{ secrets.QWEN_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Install kind and kubectl (pinned versions)
        run: |
          curl -fsSL -o /usr/local/bin/kind https://kind.sigs.k8s.io/dl/v0.24.0/kind-linux-amd64
          chmod +x /usr/local/bin/kind
          curl -fsSL -o /usr/local/bin/kubectl "https://dl.k8s.io/release/v1.31.1/bin/linux/amd64/kubectl"
          chmod +x /usr/local/bin/kubectl
          kind version && kubectl version --client
      - name: Run kind e2e test (real cluster + real /diagnose)
        if: ${{ env.QWEN_API_KEY != '' || env.OPENAI_API_KEY != '' }}
        run: bash scripts/run_integration_test.sh
      - name: E2E skipped (no LLM secret configured)
        if: ${{ !(env.QWEN_API_KEY != '' || env.OPENAI_API_KEY != '') }}
        run: |
          echo "No QWEN_API_KEY/OPENAI_API_KEY repository secret configured - e2e skipped."
          echo "Add secret QWEN_API_KEY (Settings -> Secrets and variables -> Actions) to enable the real end-to-end diagnosis check."
