name: CI

# Security-сканирование (dependency-audit, security-scan) отключается
# репозиторной переменной SKIP_SECURITY_SCAN=true (Settings -> Secrets and
# variables -> Actions -> Variables) для dev-форков; по умолчанию включено.
#
# Пропуск прогона: добавьте [skip ci] или [ci skip] в заголовок коммита
# (нативная поддержка GitHub Actions) — полезно для docs-only правок.
#
# Версии actions (проверено 2026-10-19 по runs.using в action.yml каждого тега):
# все JS-actions переведены на мажоры с runtime node24 — GitHub депрецировал
# Node.js 20 (changelog 2025-09-19) и выдавал warning в Annotations для
# checkout@v4 / setup-python@v5 / cache@v4 / upload-artifact@v4 /
# setup-buildx-action@v3 / build-push-action@v6. Нюанс: upload-artifact
# по умолчанию на node24 только начиная с v6 (v5 всё ещё таргетит node20).
# hadolint-action@v3.1.0 (актуальный тег задачи) и trivy-action@master
# оставлены как есть: это docker/composite-actions без node-рантайма,
# предупреждений они не дают.
#
# Раннер зафиксирован на ubuntu-24.04: метка ubuntu-latest мигрирует на
# Ubuntu 26 начиная 2026-10-19 (actions/runner-images#14748), из-за чего в
# Annotations висел notice. Пиннинг убирает notice и даёт воспроизводимость
# (e2e c kind чувствителен к версиям docker/kind из образа раннера).
# Пересмотреть пиннинг, когда Ubuntu 26 стабилизируется в ubuntu-latest.
#
# Топология пайплайна (цель 5-6 минут):
#   PR:  lint ─┐
#        helm ─┼─> test (pytest-xdist)                     -> финиш
#   main: lint ─┤
#         helm ─┴─> test ──> build (Docker, gha-кэш max)  -> финиш
#                         └─> integration-test (kind e2e, только main/dispatch)
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    # reason виден в UI рана (секция "Workflow inputs") и в payload события.
    # Важно: GitHub ОТВЕРГАЕТ dispatch с ключами, не объявленными в workflow
    # (422 "Unexpected inputs provided: [reason]" — проверено эмпирически
    # 2026-10-30), поэтому секция inputs обязательна для работы
    # scripts/verify_ci_cache.sh, который шлёт `-f reason="cache-verification"`.
    inputs:
      reason:
        description: "Причина ручного запуска (cache-verification — от scripts/verify_ci_cache.sh)"
        type: string
        required: false
        default: "manual"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          # Встроенный cache: pip НЕ используется: кэш ведёт явный шаг
          # actions/cache ниже — единый ключ на все Python-джобы workflow.
      - name: Cache pip dependencies
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt', 'requirements-dev.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Run ruff check
        run: ruff check src tests scripts eval ui

  helm:
    name: Helm lint & template
    runs-on: ubuntu-24.04
    # Параллельно с lint (без needs): быстрый независимый гейт чарта.
    # Шага "Cache pip dependencies" здесь НЕТ осознанно: job не устанавливает
    # Python-зависимости (системный python3 используется только для YAML-валидации
    # helm template). Пустой кэш-шаг под общим ключом был бы вреден: при cache miss
    # самый быстрый job сохраняет кэш первым, и пустой ~/.cache/pip "отравил" бы
    # общий ключ до изменения requirements*.
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Install Helm
        run: curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
      - name: helm lint
        run: helm lint charts/ai-agent
      - name: helm template (render + YAML validation)
        run: |
          helm template ai-agent charts/ai-agent --set secrets.llmApiKey=ci-placeholder \
            | python3 -c 'import sys, yaml; docs=[d for d in yaml.safe_load_all(sys.stdin) if d]; kinds=sorted({d["kind"] for d in docs}); print(kinds); assert "Deployment" in kinds and "Secret" in kinds'

  test:
    name: Tests (pytest + coverage, xdist)
    runs-on: ubuntu-24.04
    # Зависит только от lint (fast-gate: не греем раннер тестами при битом линтере).
    needs: lint
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          # Встроенный cache: pip НЕ используется: кэш ведёт явный шаг
          # actions/cache ниже — единый ключ на все Python-джобы workflow.
      - name: Cache pip dependencies
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt', 'requirements-dev.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Run pytest with coverage (parallel, xdist)
        # -n auto: тесты раскладываются по всем ядрам раннера (ускорение 2-4x);
        # pytest-cov корректно суммирует покрытиеAcross workers в coverage.xml.
        run: pytest -n auto --cov=src --cov-report=xml --cov-fail-under=85 tests/
      - name: Docs metrics drift guard (README vs pytest)
        run: python scripts/check_docs_metrics.py
      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-xml
          path: coverage.xml
          retention-days: 7

  dependency-audit:
    name: Dependency audit (pip-audit)
    runs-on: ubuntu-24.04
    # Параллельно с test (both need lint): shift-left без удорожания critical path.
    needs: lint
    if: ${{ vars.SKIP_SECURITY_SCAN != 'true' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          # Встроенный cache: pip НЕ используется: кэш ведёт явный шаг
          # actions/cache ниже — единый ключ на все Python-джобы workflow.
      - name: Cache pip dependencies
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt', 'requirements-dev.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      - name: Install pip-audit
        run: python -m pip install --upgrade pip pip-audit
      - name: pip-audit runtime requirements (BLOCKING)
        # Блокирующий аудит ТОЛЬКО runtime-зависимостей (requirements.txt):
        # dev-зависимости (ruff, pytest-cov, pytest-xdist) не попадают в
        # runtime-образ (Dockerfile ставит только requirements.txt), поэтому
        # их уязвимости не блокируют CI — см. следующий шаг (report-only).
        run: pip-audit -r requirements.txt --progress-spinner off
      - name: pip-audit dev requirements (report only, non-blocking)
        continue-on-error: true
        run: pip-audit -r requirements-dev.txt --progress-spinner off

  build:
    name: Build Docker image (no push)
    runs-on: ubuntu-24.04
    needs: [test, helm]
    # На PR образ не собираем (lint+test+helm дают быстрый фидбек); полная
    # сборка со smoke-тестом — на push в main и workflow_dispatch.
    if: github.event_name != 'pull_request'
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build image (validation only, no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: k8s-incident-agent:ci-${{ github.sha }}
          cache-from: type=gha
          # mode=max экспортирует ВСЕ слои builder-стадии, включая cache-mounts
          # pip из Dockerfile (--mount=type=cache,target=/root/.cache/pip):
          # при изменении requirements.txt wheels не скачиваются заново, а
          # берутся из кэша — это и даёт целевые 5-6 минут на тёплом раннере.
          cache-to: type=gha,mode=max
      - name: Smoke test container
        run: |
          docker run --rm -d --name agent-smoke \
            -e LOG_LEVEL=INFO \
            -p 8000:8000 \
            k8s-incident-agent:ci-${{ github.sha }}
          for i in $(seq 1 15); do
            if curl -sf http://localhost:8000/health; then
              echo "Health check OK"
              break
            fi
            sleep 2
            if [ "$i" = "15" ]; then
              echo "Health check FAILED"
              docker logs agent-smoke
              exit 1
            fi
          done
          docker stop agent-smoke

  security-scan:
    name: Security scan (Trivy image + Hadolint)
    runs-on: ubuntu-24.04
    # После build: сканируем ГОТОВЫЙ runtime-образ (пересборка из тёплого
    # gha-кэша ~1-2 мин) параллельно с integration-test.
    # Шага "Cache pip dependencies" здесь НЕТ осознанно: Python-зависимости не
    # устанавливаются (Hadolint/Buildx/Trivy — внешние actions); pip внутри
    # Docker-сборки кэшируется BuildKit cache-mounts через type=gha, а БД Trivy —
    # отдельным шагом "Cache Trivy vulnerability DB" ниже.
    needs: build
    if: ${{ vars.SKIP_SECURITY_SCAN != 'true' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Hadolint (Dockerfile best-practices lint)
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          failure-threshold: error
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Rebuild image from warm GHA cache (scan target)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: k8s-incident-agent:scan-${{ github.sha }}
          cache-from: type=gha
          # cache-to здесь НЕ нужен: кэш уже экспортировал job build.
      - name: Cache Trivy vulnerability DB
        uses: actions/cache@v6
        with:
          path: ~/.cache/trivy
          key: trivy-db-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            trivy-db-${{ runner.os }}-
      - name: Trivy image scan (CRITICAL,HIGH -> fail-fast)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: k8s-incident-agent:scan-${{ github.sha }}
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH
          # Не фиксируем уязвимости без доступного фикса (upstream-patched
          # релиз закроет их сам); фиксящиеся CRITICAL/HIGH роняют CI.
          ignore-unfixed: true
          scanners: vuln,secret

  integration-test:
    name: E2E (kind cluster, ImagePullBackOff)
    runs-on: ubuntu-24.04
    # e2e валидирует ИСХОДНИКИ агента (uvicorn из репозитория), а не образ —
    # поэтому ждём только test и идём ПАРАЛЛЕЛЬНО с build (экономия ~3 минуты).
    needs: [test]
    # Тяжёлый e2e-сценарий: только push в main и ручные запуски, PR не замедляет.
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    env:
      QWEN_API_KEY: ${{ secrets.QWEN_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          # Встроенный cache: pip НЕ используется: кэш ведёт явный шаг
          # actions/cache ниже — единый ключ на все Python-джобы workflow.
      - name: Cache pip dependencies
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt', 'requirements-dev.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      - name: Install dependencies
        if: ${{ env.QWEN_API_KEY != '' || env.OPENAI_API_KEY != '' }}
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Install kind and kubectl (pinned versions)
        if: ${{ env.QWEN_API_KEY != '' || env.OPENAI_API_KEY != '' }}
        run: |
          # /usr/local/bin на новых раннерах может быть недоступен для chmod —
          # ставим в $HOME/.local/bin и добавляем в PATH следующего шага.
          mkdir -p "$HOME/.local/bin"
          curl -fsSL -o "$HOME/.local/bin/kind" https://kind.sigs.k8s.io/dl/v0.24.0/kind-linux-amd64
          curl -fsSL -o "$HOME/.local/bin/kubectl" "https://dl.k8s.io/release/v1.31.1/bin/linux/amd64/kubectl"
          chmod +x "$HOME/.local/bin/kind" "$HOME/.local/bin/kubectl"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/kind" version && "$HOME/.local/bin/kubectl" version --client
      - name: Run kind e2e test (real cluster + real /diagnose)
        if: ${{ env.QWEN_API_KEY != '' || env.OPENAI_API_KEY != '' }}
        run: bash scripts/run_integration_test.sh
      - name: E2E skipped (no LLM secret configured)
        if: ${{ !(env.QWEN_API_KEY != '' || env.OPENAI_API_KEY != '') }}
        run: |
          echo "No QWEN_API_KEY/OPENAI_API_KEY repository secret configured - e2e skipped."
          echo "Add secret QWEN_API_KEY (Settings -> Secrets and variables -> Actions) to enable the real end-to-end diagnosis check."
